services:
  - type: web
    name: digiqueue
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: OTP_MODE
        value: demo
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
